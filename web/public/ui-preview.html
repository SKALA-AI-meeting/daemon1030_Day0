<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day Zero · 블루 UI 목업</title>
<style>
:root{--plum:#4876ef;--accent:#4876ef;--ink:#292e41;--muted:#68788f;--line:#e3e8f0;--bg:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}button,input{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8aaafb;outline-offset:3px}button{background:white;color:inherit}a{color:inherit;text-decoration:none}.demo{background:#edf3ff;color:#68788f;padding:8px 28px;font-size:12px;display:flex;justify-content:space-between;gap:12px}.top{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:42px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;letter-spacing:-.6px}.mark{display:grid;place-items:center;background:var(--plum);color:white;width:32px;height:32px;border-radius:10px;font-size:15px}.top nav{display:flex;gap:25px;height:100%;align-items:center}.top nav button{height:100%;color:var(--muted);border-bottom:3px solid transparent;padding-top:3px}.top nav button.active{color:var(--plum);border-color:var(--plum);font-weight:700}.right{margin-left:auto}.shell{display:flex;min-height:calc(100vh - 105px)}aside{width:226px;background:white;border-right:1px solid var(--line);padding:30px 18px;flex-shrink:0}.aside-label{font-size:10px;letter-spacing:1.4px;color:#68788f;padding:0 14px;margin-bottom:13px}aside button{width:100%;text-align:left;padding:12px 14px;border-radius:8px;color:#68788f;margin-bottom:5px}aside button.active{background:#edf3ff;color:#4876ef;font-weight:700}.aside-foot{font-size:12px;color:#68788f;border-top:1px solid var(--line);padding:18px 14px;margin-top:32px}main{width:100%;max-width:1250px;margin:auto;padding:38px 46px 70px;align-self:flex-start}.crumb{font-size:12px;color:var(--muted);margin-bottom:20px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font-size:28px;line-height:1.35;letter-spacing:-1px;margin:0 0 9px}h2{font-size:18px;letter-spacing:-.5px;margin:0 0 6px}h3{font-size:15px;margin:0}p{margin:7px 0}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid #d7dfea;border-radius:8px;padding:10px 17px;background:white;font-weight:600;font-size:13px;white-space:nowrap}.btn.primary{background:var(--plum);border-color:var(--plum);color:white}.btn:disabled{opacity:.35;cursor:default}.btn.soft{background:#edf3ff;border-color:transparent;color:#4876ef}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:12px}.stat{padding:20px 24px}.stat strong{display:block;font-size:30px;line-height:1.3;margin-top:9px;font-weight:650}.stat span{font-size:12px;color:var(--muted)}.stat em{font-style:normal;color:#68788f;font-size:13px;margin-left:7px}.card{padding:26px;margin-bottom:20px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.chip{display:inline-block;font-size:11px;padding:4px 9px;border-radius:5px;background:#edf3ff;color:#68788f}.badge{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;background:#f0f3f7;color:#68788f;font-size:11px;font-weight:600}.green{background:#e9f5ef;color:#277451}.amber{background:#fff4df;color:#9f741c}.purple{background:#edf3ff;color:#4876ef}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.toolbar{display:flex;align-items:center;gap:9px;padding:0 0 18px}.search{border:1px solid var(--line);background:#f8fafc;border-radius:7px;padding:9px 12px;min-width:240px;color:var(--ink)}.tabs{display:flex;border-bottom:1px solid var(--line);gap:25px;margin-bottom:24px}.tabs button{padding:12px 0;color:var(--muted);background:transparent;border-bottom:2px solid transparent;font-size:13px}.tabs button.active{border-color:var(--plum);color:var(--plum);font-weight:700}.tabs span{margin-left:5px;font-size:11px;color:#68788f}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#f8fafc;color:#68788f;font-weight:500;font-size:11px;padding:12px 15px;border-block:1px solid var(--line)}td{padding:19px 15px;border-bottom:1px solid #eef1f6}tr:last-child td{border-bottom:0}.person{white-space:nowrap;display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#edf3ff;color:#68788f;font-size:12px;font-weight:700}.person small{display:block;color:#68788f;font-size:11px}.link{color:#4876ef;font-weight:600;font-size:12px;padding:0;background:transparent}.report-layout{display:grid;grid-template-columns:180px 1fr;gap:24px}.report-nav{position:sticky;top:22px;height:fit-content}.report-nav a{display:block;font-size:12px;padding:9px 11px;color:#68788f}.report-nav a:first-child{background:#edf3ff;color:#4876ef;border-radius:7px;font-weight:600}.summary{border-top:3px solid #4876ef;background:linear-gradient(120deg,#fff,#f7faff)}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#68788f;margin-bottom:10px}.summary p{line-height:1.95;font-size:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.insight{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.insight h3{font-size:12px;color:#4876ef}.insight p{font-size:12px;color:#68788f}.criterion{padding:17px 0;border-bottom:1px solid var(--line)}.criterion:last-child{border:0;padding-bottom:0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.criterion p{font-size:12px;color:var(--muted);margin-top:8px}details{margin-top:12px;font-size:12px;color:#68788f}summary{cursor:pointer;color:#4876ef}blockquote{border-left:2px solid #b1c7fa;background:#f7faff;padding:12px 16px;margin:12px 0 0;color:#68788f}.number{font-size:11px;color:#68788f;margin-right:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.project{cursor:pointer;transition:transform .2s,border-color .2s}.project:hover{transform:translateY(-3px);border-color:#8eacf5}.project-footer{display:flex;gap:22px;border-top:1px solid var(--line);padding-top:17px;margin-top:24px;font-size:12px;color:var(--muted)}.steps{display:flex;gap:28px;margin:22px 0 32px;color:#68788f;font-size:12px}.steps .active{color:#4876ef;font-weight:700}.circle{display:inline-grid;place-items:center;border-radius:50%;width:23px;height:23px;background:#edf3ff;margin-right:7px;font-size:11px}.active .circle{color:white;background:var(--plum)}.selection{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.option{display:flex;gap:10px;align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.option:has(input:checked){background:#f7faff;border-color:#7b9df5}.option input{accent-color:#4876ef;margin-top:5px}.option small{display:block;color:#68788f;margin-top:4px;font-size:11px}.field{display:block;margin:22px 0 12px;font-size:12px;color:#68788f}.field input{display:block;width:100%;margin-top:8px;border:1px solid #dce3ee;padding:12px;border-radius:8px;background:white}.note{background:#f7faff;border:1px solid #dde7fc;border-radius:9px;padding:15px 18px;font-size:12px;color:#68788f;margin:20px 0}.footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px;margin-top:24px}.prep{max-width:820px;margin:auto}.prep-item{display:flex;gap:18px;padding:21px 0;border-bottom:1px solid var(--line)}.prep-item .avatar{flex-shrink:0;background:#edf3ff;width:40px;height:40px}.prep-item p{font-size:13px;color:var(--muted)}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:13px 22px;background:#2a436a;color:white;border-radius:10px;box-shadow:0 5px 30px #243d6a20;z-index:20}.modal-back{position:fixed;inset:0;background:#1c315566;display:grid;place-items:center;z-index:15}.modal{background:white;border-radius:16px;width:min(460px,90vw);padding:30px}.hidden{display:none!important}@media(min-width:1500px){main{padding-top:48px}}@media(max-width:1000px){aside{width:180px}main{padding:28px 24px}.report-layout{grid-template-columns:1fr}.report-nav{position:static;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.report-nav .note{margin:0;padding:9px 12px}.stats{gap:9px}.stat{padding:16px}.top{padding:0 20px;gap:22px}}@media(max-width:720px){aside{display:none}.demo{padding:7px 15px}.demo span:last-child{display:none}.top{height:62px}.top nav{gap:13px}.top nav button{font-size:12px}.right{display:none}main{padding:25px 16px}.heading{align-items:flex-start}h1{font-size:23px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.two,.selection{grid-template-columns:1fr}.card{padding:20px}.toolbar{flex-wrap:wrap}.search{min-width:0;width:100%}.table-wrap{overflow:auto}table{min-width:620px}.steps{gap:12px}.steps .circle{margin-right:4px}.heading .btn{padding:9px 12px}}
</style>
<body><div class="demo"><span>디자인 미리보기 · 모든 이름, 수치, 평가 의견은 가상 예시입니다.</span><span>실제 계정·평가 데이터와 연결되지 않습니다</span></div><header class="top"><a class="brand" href="#projects"><span class="mark">D₀</span><strong>Day Zero</strong></a><nav><button id="companyNav" onclick="go('projects')">평가 프로젝트</button><button id="personalNav" onclick="go('personal')">나의 평가</button></nav><span class="right muted small">UI 목업 · 기업 / 개인 화면 미리보기</span></header><div class="shell"><aside><div class="aside-label">DESIGN PREVIEW</div><button data-page="projects" onclick="go('projects')">▦　프로젝트 목록</button><button data-page="create" onclick="go('create')">＋　프로젝트 만들기</button><button data-page="detail" onclick="go('detail')">☷　지원자 관리</button><button data-page="report" onclick="go('report')">▤　개인별 리포트</button><div class="aside-label" style="margin-top:28px">CANDIDATE</div><button data-page="personal" onclick="go('personal')">▣　나의 평가</button><button data-page="prep" onclick="go('prep')">✓　응시 준비</button><div class="aside-foot">왼쪽 메뉴를 눌러<br>6개 화면을 살펴보세요.<br><br>이 메뉴는 목업 탐색용입니다.</div></aside><main id="app"></main></div><div id="modal" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const competencies=['의사소통·요구 파악','협업·갈등 조율','책임 이행·일정 관리','문제 해결·우선순위 판단','변화 대응·피드백 수용','비판적 검토·AI 활용'];
const chip=(s)=>`<span class="chip">${s}</span>`;
const badge=(s,c='')=>`<span class="badge ${c}"><i class="dot"></i>${s}</span>`;
const stats=()=>`<div class="stats">${[['초대한 지원자','12','명'],['응시 중','3','명'],['응시 완료','7','명'],['리포트 준비','6','건']].map((s,i)=>`<div class="stat"><span>${s[0]}</span><strong style="${i===3?'color:#4876ef':''}">${s[1]}<em>${s[2]}</em></strong></div>`).join('')}</div>`;
const heading=(title,desc,action='')=>`<div class="heading"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${action}</div>`;
let filter='all', selected=new Set([0,1,3,4,5]);
const people=[['가상 지원자 A','candidate.a@example.test','응시 완료','리포트 준비','green'],['가상 지원자 B','candidate.b@example.test','응시 완료','분석 중','purple'],['가상 지원자 C','candidate.c@example.test','응시 중','—','purple'],['가상 지원자 D','candidate.d@example.test','시작 대기','—',''],['가상 지원자 E','candidate.e@example.test','일시정지','—','amber']];
function rows(){const q=(document.getElementById('candidateSearch')?.value||'').toLowerCase();document.getElementById('rows').innerHTML=people.filter(p=>(filter==='all'||p[2]===filter||p[3]===filter)&&p.join(' ').toLowerCase().includes(q)).map((p,i)=>`<tr><td><div class="person"><span class="avatar">${p[0].slice(-1)}</span><div><strong>${p[0]}</strong><small>예시 지원자</small></div></div></td><td class="muted">${p[1]}</td><td>${badge(p[2],p[4])}</td><td>${p[3]==='리포트 준비'?badge(p[3],'green'):`<span class="muted small">${p[3]}</span>`}</td><td>${p[3]==='리포트 준비'?'<button class="link" onclick="go(\'report\')">리포트 보기 →</button>':''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">조건에 맞는 지원자가 없습니다.</td></tr>'}
const views={
projects:()=>heading('평가 프로젝트','함께 일하는 과정을 관찰하고, 지원자별 근거를 확인하세요.','<button class="btn primary" onclick="go(\'create\')">＋ 프로젝트 만들기</button>')+`<div class="toolbar"><input class="search" aria-label="프로젝트 검색" placeholder="⌕  프로젝트 검색" oninput="document.querySelectorAll('.project').forEach(e=>e.hidden=!e.innerText.includes(this.value))"><span class="right muted small">전체 3개 프로젝트 · 예시</span></div><div class="grid">${['주니어 프로덕트 매니저 채용','고객 경험 담당자 채용','서비스 운영 매니저 채용'].map((name,i)=>`<a class="card project" href="#detail"><div class="row">${badge(i===2?'응시 준비':'평가 진행 중',i===2?'':'purple')}<span class="muted small">2026.10.${20-i*2}</span></div><h2 style="margin-top:22px">${name}</h2><p class="muted small">${['신규 기능 개선안 기획','서비스 장애·고객 불만 대응','출시 준비·팀 업무 조율'][i]}</p><div class="chips">${[competencies[0],competencies[3],competencies[4]].map(chip).join('')}</div><div class="project-footer"><span>초대 <strong>${12-i*4}</strong></span><span>응시 완료 <strong>${7-i*3<0?0:7-i*3}</strong></span><span>리포트 <strong>${6-i*3}</strong></span><span style="margin-left:auto;color:#4876ef">관리 →</span></div></a>`).join('')}</div>`,
detail:()=>`<div class="crumb"><a href="#projects">평가 프로젝트</a>　/　프로젝트 상세</div>`+heading('주니어 프로덕트 매니저 채용','신규 기능 개선안 기획 · 제한 시간 120분','<button class="btn primary" onclick="invite()">＋ 지원자 초대</button>')+`<div class="chips" style="margin-top:-13px">${[0,1,3,4,5].map(i=>chip(competencies[i])).join('')}</div>`+stats()+`<section class="card"><div class="row" style="margin-bottom:12px"><h2>지원자 관리</h2><span class="small muted">표에는 예시 지원자 5명만 표시</span></div><div class="tabs">${[['all','전체'],['응시 중','응시 중'],['응시 완료','응시 완료'],['리포트 준비','리포트 준비']].map(([v,l])=>`<button class="${filter===v?'active':''}" onclick="filter='${v}';render()">${l}</button>`).join('')}</div><div class="toolbar"><input id="candidateSearch" class="search" placeholder="⌕  지원자 이름 또는 이메일 검색" aria-label="지원자 검색" oninput="rows()"><span class="right small muted">리포트 준비 상태를 확인하고 열어보세요.</span></div><div class="table-wrap"><table><thead><tr><th>지원자</th><th>이메일</th><th>응시 상태</th><th>분석 상태</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>`,
report:()=>`<div class="crumb"><a href="#projects">평가 프로젝트</a>　/　<a href="#detail">지원자 관리</a>　/　가상 지원자 A</div>`+heading('가상 지원자 A의 업무 리포트','주니어 프로덕트 매니저 채용 · 신규 기능 개선안 기획',badge('리포트 준비','green'))+`<div class="report-layout"><nav class="report-nav" aria-label="리포트 내 이동"><a href="#" onclick="jump(event,'overview')">AI 종합 의견</a><a href="#" onclick="jump(event,'deliverable')">최종 결과물 검토</a><a href="#" onclick="jump(event,'competency')">역량별 평가</a><div class="note">예시 평가 의견입니다.<br>실제 분석 결과가 아닙니다.</div></nav><div><section id="overview" class="card summary"><div class="eyebrow">ASSESSMENT OVERVIEW</div><h2>핵심 요구를 정리하고,<br>변경된 조건을 실행 계획에 반영했습니다.</h2><p style="margin-top:18px">사용자 불편을 근거로 개선 방향을 제안했고, 개발 범위가 축소되었을 때 핵심 기능을 우선하는 안으로 조정했습니다. 다만 성과를 확인할 지표와 검증 방법은 더 구체적으로 설명할 필요가 있습니다.</p><div class="two insight"><div><h3>확인된 강점</h3><p>요구사항 확인 · 변경 조건 반영 · 근거 대조</p></div><div><h3>보완할 점</h3><p>성공 지표 정의 · 가설 검증 계획 구체화</p></div></div><details><summary>종합 의견의 근거 보기</summary><blockquote>“이번 범위에서는 알림 설정을 우선하고, 대시보드는 후속으로 분리하겠습니다.”<br><span class="muted">예시 · 최종 제출 문서 / 실행 계획</span></blockquote></details></section><section id="deliverable" class="card"><div class="row"><h2>최종 결과물 검토</h2><span class="muted small">시나리오 기준 6개</span></div><p class="muted small">최종 제출 내용과 제공된 자료를 대조한 예시입니다.</p>${['문제·요구사항 정리','수치와 근거의 정확성','대안 비교와 선택 이유','변경된 제약 반영','실행 역할과 일정','가설과 검증 계획'].map((s,i)=>`<div class="criterion"><div class="row"><h3><span class="number">0${i+1}</span>${s}</h3>${badge(i===5?'일부 충족':'기준 충족',i===5?'amber':'green')}</div><p>${i===5?'확인할 방향은 제시했으나, 측정 지표와 검증 조건이 충분히 구체적이지 않습니다.':'제출물에서 해당 기준과 연결되는 설명을 확인할 수 있습니다.'}</p><details><summary>검토 기준 · 근거 확인</summary><p>이 항목은 시나리오에 정의된 결과물 검토 기준을 따릅니다.</p><blockquote>예시 인용: ${i===5?'출시 후 사용자 반응을 확인하겠습니다.':'우선 적용 범위와 선택한 이유를 관련 자료와 함께 정리했습니다.'}<br><small>최종 제출 문서 · 목업용 가상 근거</small></blockquote></details></div>`).join('')}</section><section id="competency" class="card"><h2>역량별 평가</h2><p class="muted small">관찰된 행동과 AI의 해석을 함께 확인합니다.</p>${[0,1,3,4,5].map((n,i)=>`<div class="criterion"><div class="row"><h3>${competencies[n]}</h3><span class="small muted">예시 관찰 근거 ${i+2}개</span></div><p><strong style="color:#4876ef">AI 평가</strong>　${['모호한 요청을 질문으로 확인하고, 합의한 내용을 팀에 다시 전달했습니다.','동료의 의견을 확인하고 역할 경계를 협의했습니다.','자료와 제약을 함께 검토해 실행할 대안의 우선순위를 정했습니다.','변경 요청의 영향을 설명하고 과제 범위를 조정했습니다.','AI가 제안한 수치를 원문과 비교하고 다른 값을 수정했습니다.'][i]}</p><details><summary>관찰 상황과 실제 기록 펼치기</summary><blockquote>예시 대화: “이 요청에서 가장 먼저 해결해야 하는 불편이 무엇인지 확인하고 싶습니다.”<br><small>팀 대화 · 경과 12분 · 가상 예시</small></blockquote><p>행동 기록과 AI 해석은 구분해 제시합니다.</p></details></div>`).join('')}</section><p class="muted small">이 화면은 UI 검토를 위한 가상 예시이며 점수·순위·채용 판정을 제공하지 않습니다.</p></div></div>`,
create:()=>`<div class="crumb"><a href="#projects">평가 프로젝트</a>　/　새 프로젝트</div>`+heading('어떤 역량을 관찰할까요?','평가할 역량을 선택하면, 모든 선택 역량을 지원하는 시나리오를 확인할 수 있습니다.')+`<div class="steps"><span><b class="circle">✓</b>기본 정보</span><span class="active"><b class="circle">2</b>역량 선택</span><span><b class="circle">3</b>시나리오·확인</span></div><section class="card"><label class="field" style="margin-top:0">프로젝트 이름<input value="주니어 프로덕트 매니저 채용" aria-label="프로젝트 이름"></label><div class="row" style="margin-top:25px"><h2>관찰 역량</h2><span id="count" class="badge"></span></div><p class="muted small">최소 3개, 최대 6개를 선택하세요.</p><div class="selection">${competencies.map((c,i)=>`<label class="option"><input type="checkbox" ${selected.has(i)?'checked':''} onchange="this.checked?selected.add(${i}):selected.delete(${i});updateSelection()"><span><strong>${c}</strong><small>${['요구를 확인하고 핵심 내용을 명확하게 전달하는 행동','의견 차이를 조정하고 역할을 함께 정하는 행동','진행 상황과 일정, 맡은 업무를 관리하는 행동','근거와 제약을 검토하고 대안을 선택하는 행동','새로운 조건에 맞춰 계획과 결과물을 조정하는 행동','동료나 AI의 제안을 근거에 비춰 검토하는 행동'][i]}</small></span></label>`).join('')}</div><div id="scenarioResult" class="note"></div><div class="footer"><a class="muted small" href="#projects">취소하고 목록으로</a><button id="nextBtn" class="btn primary" onclick="scenarioModal()">시나리오 확인 →</button></div></section>`,
personal:()=>heading('나의 평가','초대받은 평가를 확인하고, 준비가 되면 시작하세요.')+`<div class="tabs"><button class="active" onclick="togglePersonal(this,false)">진행할 평가 <span>1</span></button><button onclick="togglePersonal(this,true)">완료한 평가 <span>1</span></button></div><div id="pendingAssessment"><article class="card" style="max-width:800px"><div class="row">${badge('시작 대기','purple')}<span class="muted small">예시 기업 · 데이제로랩</span></div><h2 style="font-size:23px;margin-top:22px">주니어 프로덕트 매니저 채용</h2><p class="muted">신규 기능 개선안 기획</p><div class="chips">${chip('제한 시간 120분')}${chip('AI 동료와 협업')}${chip('과제 문서 작성')}</div><div class="note">시작 전 과제 안내와 오피스 사용법을 확인할 수 있어요.<br>시간은 ‘응시 시작’을 누른 이후부터 흐릅니다.</div><div class="footer"><span class="muted small">안내 확인 → 동의 → 응시 시작</span><button class="btn primary" onclick="go('prep')">응시 준비하기 →</button></div></article></div><div id="completedAssessment" class="hidden"><article class="card" style="max-width:800px">${badge('응시 완료','green')}<h2 style="margin-top:20px">서비스 운영 매니저 채용</h2><p class="muted">출시 준비·팀 업무 조율</p><div class="note">과제가 정상적으로 제출되었습니다.<br>예시 제출 시각 · 2026.10.19 15:42</div><p class="small muted">개인 화면에는 응시 완료 상태를 표시합니다.</p></article></div>`,
prep:()=>`<div class="prep"><div class="crumb"><a href="#personal">나의 평가</a>　/　응시 준비</div>`+heading('시작하기 전에 확인해 주세요.','주니어 프로덕트 매니저 채용 · 신규 기능 개선안 기획')+`<section class="card"><div class="eyebrow">BEFORE YOU START</div><h2>AI 동료와 함께 과제를 수행합니다.</h2><p class="muted">팀의 대화와 자료를 확인하고, 오른쪽 작성 영역에 결과물을 정리해 주세요.</p>${[['01','가상 오피스 사용법','왼쪽에서 팀 대화·개인 DM·어시스턴트를 전환합니다. 대화 창을 접으면 작성 공간을 넓게 쓸 수 있습니다.'],['02','제한 시간과 연결 종료','제한 시간은 120분입니다. 서버가 연결 종료를 감지하면 시간을 일시정지하며, 재연결하면 이어서 응시합니다.'],['03','저장과 최종 제출','작성 내용은 자동 저장됩니다. 제한 시간 전에도 언제든 최종 제출할 수 있으며, 제출 후에는 수정할 수 없습니다.']].map(x=>`<div class="prep-item"><span class="avatar">${x[0]}</span><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}<label class="option" style="margin-top:24px"><input id="consent" type="checkbox" onchange="document.getElementById('startBtn').disabled=!this.checked"><span><strong>안내와 기록 수집 내용을 확인했습니다.</strong><small>실제 서비스에서는 동의 문서 전문과 수집 항목을 함께 제공합니다.</small></span></label><div class="footer"><span class="small muted">목업에서는 실제 응시가 시작되지 않습니다.</span><button id="startBtn" disabled class="btn primary" onclick="notify('응시 시작 버튼을 확인했어요. 실제 평가 데이터는 변경되지 않습니다.')">응시 시작 →</button></div></section></div>`};
function updateSelection(){document.getElementById('count').textContent=selected.size+' / 6 선택';const available=[['신규 기능 개선안 기획',2],['서비스 장애·고객 불만 대응',1],['출시 준비·팀 업무 조율',5]].filter(x=>!selected.has(x[1]));const valid=selected.size>=3&&available.length>0;document.getElementById('scenarioResult').textContent=selected.size<3?'역량을 3개 이상 선택하면 가능한 시나리오를 확인할 수 있습니다.':available.length?`선택 역량을 모두 지원하는 시나리오 ${available.length}개가 있습니다. · ${available.map(x=>x[0]).join(' / ')}`:'선택한 6개 역량을 모두 지원하는 시나리오가 없습니다. 선택 역량을 조정해 주세요.';document.getElementById('nextBtn').disabled=!valid}
function scenarioModal(){const available=[['신규 기능 개선안 기획',2],['서비스 장애·고객 불만 대응',1],['출시 준비·팀 업무 조율',5]].filter(x=>!selected.has(x[1]));openModal(`<h2>시나리오 선택</h2><p class="muted small">선택한 역량을 모두 지원하는 시나리오입니다.</p>${available.map((s,i)=>`<label class="option" style="margin-top:12px"><input type="radio" name="scenario" ${i===0?'checked':''}><span><strong>${s[0]}</strong><small>제한 시간 120분 · 최종 결과물 및 업무 과정 검토</small></span></label>`).join('')}<div class="footer"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="closeModal();notify('목업의 예시 프로젝트로 이동합니다.');go('detail')">프로젝트 생성</button></div>`)}
function invite(){openModal(`<h2>지원자 초대</h2><p class="muted small">지원자에게 전달할 초대 링크를 만듭니다.</p><form onsubmit="event.preventDefault();document.getElementById('inviteResult').classList.remove('hidden')"><label class="field">지원자 별칭<input required placeholder="예: 지원자 F"></label><label class="field">이메일<input required type="email" placeholder="candidate@example.test"></label><div id="inviteResult" class="note hidden">목업용 링크 미리보기<br><code>https://example.test/invite/preview</code><br>실제 초대는 생성되지 않으며 이메일도 발송되지 않습니다.</div><div class="footer"><button type="button" class="btn" onclick="closeModal()">닫기</button><button class="btn primary">초대 링크 만들기</button></div></form>`)}
function openModal(html){const m=document.getElementById('modal');m.className='modal-back';m.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="목업 대화상자">${html}</section>`;m.onclick=e=>{if(e.target===m)closeModal()};m.querySelector('input,button')?.focus()}function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function togglePersonal(btn,completed){document.getElementById('pendingAssessment').classList.toggle('hidden',completed);document.getElementById('completedAssessment').classList.toggle('hidden',!completed);btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn))}
function jump(e,id){e.preventDefault();document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}let timer;function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>t.classList.add('hidden'),3600)}
function go(v){if(location.hash==='#'+v)render();else location.hash=v}function render(){let page=location.hash.slice(1)||'detail';if(!views[page])page='detail';document.getElementById('app').innerHTML=views[page]();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('companyNav').classList.toggle('active',!['personal','prep'].includes(page));document.getElementById('personalNav').classList.toggle('active',['personal','prep'].includes(page));if(page==='detail')rows();if(page==='create')updateSelection();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
